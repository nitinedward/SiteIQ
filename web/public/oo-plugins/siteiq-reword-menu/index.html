<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Reword with AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script type="text/javascript" src="https://onlyoffice.site-iq.co.nz/sdkjs-plugins/v1/plugins.js"></script>
    <script type="text/javascript" src="https://onlyoffice.site-iq.co.nz/sdkjs-plugins/v1/plugins-ui.js"></script>
    <style>
        /* Mirrors the SiteIQ v3 tokens from src/app/globals.css so the card
           reads as part of the app rather than as editor chrome. */
        :root {
            --indigo:        #3A4A63;
            --indigo-deep:   #2C3950;
            --indigo-soft:   #EEF1F6;
            --marigold:      #F5A524;
            --marigold-deep: #E08D0B;
            --marigold-soft: #FBEAD1;
            --marigold-ink:  #8A5A0E;
            --sage:          #5B9279;
            --sage-soft:     #E7F0EB;
            --sage-ink:      #33684C;
            --paper:         #FAF8F4;
            --surface:       #FFFFFF;
            --text-ink:      #2A2E37;
            --text-mid:      #7A8290;
            --border-line:   #ECE8E1;
            --clay:          #E5735B;
            --clay-soft:     #FBE5E0;
            --clay-ink:      #B23D24;
            --radius-sm:     14px;
            --radius-md:     18px;
            --radius-pill:   999px;
            --shadow-card-v3: 0 8px 24px rgba(44,57,80,.08);
            --f-heading: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            --f-text:    'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; background: transparent; }
        body { font-family: var(--f-text); font-size: 13px; color: var(--text-ink); }

        /* The body IS the floating card — the editor sizes this iframe and
           parks it beside the caret. */
        #card {
            background: var(--surface);
            border: 1px solid var(--border-line);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-card-v3), 0 2px 8px rgba(44,57,80,.06);
            padding: 14px;
        }

        .head {
            display: flex; align-items: center; gap: 7px;
            font-family: var(--f-heading);
            font-size: 13.5px; font-weight: 800; color: var(--indigo-deep);
            margin-bottom: 10px;
        }
        .head .sp { flex: 1; }
        .x {
            background: none; border: none; cursor: pointer;
            color: var(--text-mid); font-size: 18px; line-height: 1; padding: 0 2px;
            border-radius: var(--radius-pill);
        }
        .x:hover { color: var(--text-ink); }

        .orig {
            font-family: var(--f-text);
            font-size: 12px; color: var(--text-mid); line-height: 1.5;
            max-height: 46px; overflow: hidden;
            padding: 8px 10px;
            background: var(--paper);
            border-radius: var(--radius-sm);
            margin-bottom: 11px;
        }

        .lbl {
            font-family: var(--f-heading);
            font-size: 10.5px; font-weight: 700; letter-spacing: .5px;
            text-transform: uppercase; color: var(--text-mid);
            margin-bottom: 7px;
        }

        .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 12px; }
        .chip {
            background: var(--surface);
            border: 1px solid var(--border-line);
            border-radius: var(--radius-pill);
            padding: 5px 12px;
            font-family: var(--f-text); font-size: 12px; font-weight: 600;
            color: var(--text-ink); cursor: pointer;
            transition: background .12s, border-color .12s, color .12s;
        }
        .chip:hover { background: var(--indigo-soft); border-color: var(--indigo); }
        .chip:active { transform: translateY(.5px); }

        input[type=text] {
            width: 100%; padding: 9px 12px;
            background: var(--surface);
            border: 1px solid var(--border-line);
            border-radius: var(--radius-sm);
            font-family: var(--f-text); font-size: 12.5px; color: var(--text-ink);
            outline: none;
        }
        input[type=text]::placeholder { color: var(--text-mid); }
        input[type=text]:focus { border-color: var(--indigo); }

        .go {
            width: 100%; margin-top: 9px;
            background: var(--marigold); color: var(--indigo-deep);
            border: none; border-radius: var(--radius-pill);
            padding: 10px;
            font-family: var(--f-heading); font-size: 13px; font-weight: 800;
            cursor: pointer;
        }
        .go:hover:not(:disabled) { background: var(--marigold-deep); }
        .go:disabled { background: var(--paper); color: var(--text-mid); cursor: default; }

        .result {
            margin-top: 4px; padding: 11px 12px;
            background: var(--sage-soft);
            border: 1px solid rgba(91,146,121,.28);
            border-radius: var(--radius-sm);
            line-height: 1.55;
            max-height: 190px; overflow-y: auto;
            white-space: pre-wrap; word-break: break-word;
        }
        .row { display: flex; gap: 6px; margin-top: 10px; }
        .row button {
            flex: 1; border-radius: var(--radius-pill); padding: 9px 6px;
            font-family: var(--f-heading); font-size: 12px; font-weight: 700;
            cursor: pointer;
        }
        .ghost { background: var(--surface); border: 1px solid var(--border-line); color: var(--text-ink); }
        .ghost:hover { background: var(--paper); }
        .danger { background: var(--surface); border: 1px solid var(--border-line); color: var(--clay-ink); }
        .danger:hover { background: var(--clay-soft); border-color: var(--clay); }
        .accept { background: var(--sage); border: none; color: #fff; }
        .accept:hover { background: var(--sage-ink); }

        .err {
            margin-top: 10px; padding: 9px 11px;
            background: var(--clay-soft); color: var(--clay-ink);
            border-radius: var(--radius-sm); font-size: 12px; line-height: 1.45;
        }
        .hidden { display: none !important; }
        .spin {
            display: inline-block; width: 11px; height: 11px; vertical-align: -1px;
            border: 2px solid rgba(44,57,80,.25); border-top-color: var(--indigo-deep);
            border-radius: 50%; animation: sp .7s linear infinite; margin-right: 7px;
        }
        @keyframes sp { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="card">
        <div class="head">
            <svg width="14" height="14" fill="none" stroke="var(--marigold-ink)" stroke-width="1.9" viewBox="0 0 24 24"><path d="M12 3l1.9 5.8L20 11l-6.1 2.2L12 19l-1.9-5.8L4 11l6.1-2.2z"/></svg>
            <span>Reword with AI</span>
            <span class="sp"></span>
            <button class="x" id="btnClose" title="Close">&times;</button>
        </div>

        <div id="orig" class="orig"></div>

        <div id="ask">
            <div class="lbl">Quick options</div>
            <div class="chips" id="chips"></div>

            <div class="lbl">Or describe the tone</div>
            <input type="text" id="tone" placeholder="e.g. more cautious, flag for monitoring…" autocomplete="off" />
            <button class="go" id="btnGo">Rewrite</button>
        </div>

        <div id="out" class="hidden">
            <div class="lbl">Suggested rewrite</div>
            <div class="result" id="result"></div>
            <div class="row">
                <button class="ghost" id="btnRetry">Try again</button>
                <button class="danger" id="btnDiscard">Delete</button>
                <button class="accept" id="btnAccept">Accept</button>
            </div>
        </div>

        <div id="err" class="err hidden"></div>
    </div>

    <script type="text/javascript" src="scripts/code.js"></script>
</body>
</html>
