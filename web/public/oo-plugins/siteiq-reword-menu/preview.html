<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Reword with AI</title>
    <script type="text/javascript" src="https://onlyoffice.site-iq.co.nz/sdkjs-plugins/v1/plugins.js"></script>
    <script type="text/javascript" src="https://onlyoffice.site-iq.co.nz/sdkjs-plugins/v1/plugins-ui.js"></script>
    <link rel="stylesheet" href="https://onlyoffice.site-iq.co.nz/sdkjs-plugins/v1/plugins.css">
    <style>
        :root {
            --accent: #2c5282;
            --ink: #1a1917;
            --mid: #9b968d;
            --line: #e4e0d9;
            --paper: #f8f7f5;
            --sage: #27705a;
            --sage-soft: #e6f4ef;
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            margin: 0;
            padding: 14px;
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 13px;
            color: var(--ink);
            background: #fff;
            display: flex;
            flex-direction: column;
        }
        .label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .6px;
            color: var(--mid);
            margin-bottom: 6px;
        }
        .block {
            padding: 10px;
            border-radius: 8px;
            line-height: 1.55;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .original {
            background: var(--paper);
            border: 1px solid var(--line);
            color: var(--mid);
            max-height: 110px;
            margin-bottom: 14px;
        }
        .rewrite {
            background: var(--sage-soft);
            border: 1px solid rgba(39,112,90,.3);
            flex: 1;
            min-height: 90px;
        }
        .row { display: flex; gap: 8px; margin-top: 14px; }
        .row button {
            flex: 1;
            border-radius: 999px;
            padding: 10px 8px;
            font-family: inherit;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }
        .btn-ghost { background: #fff; border: 1px solid var(--line); color: var(--ink); }
        .btn-accept { background: var(--sage); border: none; color: #fff; }
    </style>
</head>
<body>
    <div class="label">Original</div>
    <div id="original" class="block original"></div>

    <div class="label">Suggested rewrite</div>
    <div id="rewrite" class="block rewrite"></div>

    <div class="row">
        <button class="btn-ghost" id="btnDiscard">Discard</button>
        <button class="btn-accept" id="btnAccept">Accept</button>
    </div>

    <script type="text/javascript" src="scripts/preview.js"></script>
</body>
</html>
